name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Lấy toàn bộ lịch sử Git để tính diff chính xác [2]

      - name: Tạo file diff giữa nhánh gốc và PR
        run: git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff

      - name: Gọi OpenAI API qua cURL
        id: ai_review
        run: |
          # Sử dụng --rawfile của jq để đọc trực tiếp file diff
          # Xuất thẳng ra file /tmp/payload.json để tránh lỗi "Argument list too long" trên curl
          jq -n \
            --arg model "gpt-4o-mini" \
            --arg prompt "Bạn là một kỹ sư senior đang review Pull Request này. Dưới đây là Git diff. Hãy chỉ ra: 1. Lỗi logic 2. Thiếu xử lý ngoại lệ 3. Nguy cơ bảo mật. Trình bày dưới dạng Markdown ngắn gọn. \n\nDIFF:\n" \
            --rawfile diff_content /tmp/pr.diff \
            '{model: $model, messages: [{role: "user", content: ($prompt + $diff_content)}]}' > /tmp/payload.json
            
          echo "DEBUG: Payload JSON đã tạo thành công."
            
          RESPONSE=$(curl -s -w "\n%{http_code}" https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -d @/tmp/payload.json) || CURL_EXIT_STATUS=$?
            
          if [ -n "$CURL_EXIT_STATUS" ] && [ "$CURL_EXIT_STATUS" -ne 0 ]; then
            REVIEW_TEXT="⚠️ Gọi OpenAI API thất bại do lỗi mạng (cURL error code: $CURL_EXIT_STATUS)."
          else
            # Tách HTTP Status Code và Body
            HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            
            echo "DEBUG: API Response Status: $HTTP_STATUS"
            echo "DEBUG: API Response Body: $BODY"
            
            if [ "$HTTP_STATUS" -ne 200 ]; then
              REVIEW_TEXT="⚠️ API OpenAI trả về lỗi HTTP $HTTP_STATUS.\n\`\`\`json\n$BODY\n\`\`\`"
            else
              # Trích xuất nội dung từ phản hồi của API
              REVIEW_TEXT=$(echo "$BODY" | jq -r '.choices[0].message.content // "API_ERROR"')
              
              if [ "$REVIEW_TEXT" = "API_ERROR" ] || [ "$REVIEW_TEXT" = "null" ]; then
                 REVIEW_TEXT="⚠️ Không trích xuất được phản hồi từ AI. Phản hồi thô:\n\`\`\`json\n$BODY\n\`\`\`"
              fi
            fi
          fi

          # Lưu vào GITHUB_ENV an toàn với EOF
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "CODEX_OUTPUT<<$EOF" >> $GITHUB_ENV
          echo "$REVIEW_TEXT" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Đăng nhận xét lên PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🤖 OpenAI PR Review\n\n${process.env.CODEX_OUTPUT || 'Không có phản hồi từ AI.'}`
            });
