name: Codex PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [ main ]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Lấy toàn bộ lịch sử Git để tính diff chính xác [2]

      - name: Tạo file diff giữa nhánh gốc và PR
        run: git diff origin/${{ github.base_ref }}...HEAD > /tmp/pr.diff

      - name: Lấy nội dung Diff
        id: get_diff
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "DIFF<<$EOF" >> $GITHUB_ENV
          cat /tmp/pr.diff >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Gọi OpenAI API qua cURL
        id: ai_review
        run: |
          PROMPT="Bạn là một kỹ sư senior đang review Pull Request này. Dưới đây là Git diff. Hãy chỉ ra: 1. Lỗi logic 2. Thiếu xử lý ngoại lệ 3. Nguy cơ bảo mật. Trình bày dưới dạng Markdown ngắn gọn. \n\nDIFF:\n${{ env.DIFF }}"
          
          # Dùng jq để escape chuỗi JSON an toàn
          JSON_PAYLOAD=$(jq -n \
            --arg model "gpt-4o-mini" \
            --arg prompt "$PROMPT" \
            '{model: $model, messages: [{role: "user", content: $prompt}]}')
            
          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.OPENAI_API_KEY }}" \
            -d "$JSON_PAYLOAD")
            
          # Trích xuất nội dung từ phản hồi của API
          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.choices[0].message.content')
          
          # Lưu vào GITHUB_ENV an toàn với EOF
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "CODEX_OUTPUT<<$EOF" >> $GITHUB_ENV
          echo "$REVIEW_TEXT" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      - name: Đăng nhận xét lên PR
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🤖 OpenAI PR Review\n\n${process.env.CODEX_OUTPUT || 'Không có phản hồi từ AI.'}`
            });
